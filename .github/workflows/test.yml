name: Test

on: [push]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - run: pnpm install --frozen-lockfile
      - run: pnpm test --run
      - run: pnpm type-check
      - run: pnpm lint
      - name: Build staging worker without deploying
        run: >-
          pnpm wrangler deploy --config wrangler.staging.jsonc --dry-run
          --outdir "$RUNNER_TEMP/avatar-upload-staging"
          --var "SOURCE_COMMIT:$GITHUB_SHA"
        env:
          WRANGLER_SEND_METRICS: "false"

  deploy-staging:
    name: Deploy existing staging worker
    needs: test
    if: >-
      github.event_name == 'push' &&
      github.repository == 'ensdomains/ens-avatar-worker' &&
      github.ref == 'refs/heads/yoginth/legacy-avatar-security-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: avatar-upload-staging
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Verify existing staging target and save rollback metadata
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$(git ls-remote --exit-code origin "$GITHUB_REF" | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "Branch moved since this run started; staging deployment blocked."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          class GuardError extends Error {}
          const check = (condition, message) => {
            if (!condition) throw new GuardError(message);
          };
          const account = '15dcc9085cb794bb4f29d3e8177ac880';
          const script = 'avatar-upload-staging';
          const expectedBuckets = {
            AVATAR_BUCKET: 'staging-avatar-storage',
            HEADER_BUCKET: 'staging-header-storage',
          };
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
          const fingerprint = (binding) => createHash('sha256')
            .update(JSON.stringify([binding.type, binding.text, binding.json]))
            .digest('hex');
          const api = async (path) => {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${script}/${path}`, {
              headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
              signal: AbortSignal.timeout(20_000),
              redirect: 'error',
            });
            check(response.ok, 'Cannot read existing staging worker; deployment blocked.');
            const data = await response.json();
            check(data.success === true && data.result, 'Cloudflare rejected staging preflight; deployment blocked.');
            return data.result;
          };

          try {
            check(process.env.GITHUB_EVENT_NAME === 'push', 'Unexpected event; deployment blocked.');
            check(process.env.GITHUB_REPOSITORY === 'ensdomains/ens-avatar-worker', 'Unexpected repository; deployment blocked.');
            check(process.env.GITHUB_REF === 'refs/heads/yoginth/legacy-avatar-security-v2', 'Unexpected branch; deployment blocked.');
            check(process.env.CLOUDFLARE_ACCOUNT_ID === account, 'Cloudflare account secret does not match the ENS account; deployment blocked.');
            check(Boolean(process.env.CLOUDFLARE_API_TOKEN), 'Missing Cloudflare token; deployment blocked.');
            const config = JSON.parse(readFileSync('wrangler.staging.jsonc', 'utf8'));
            check(config.account_id === account && config.name === script && config.main === 'src/index.ts', 'Unexpected staging configuration target; deployment blocked.');
            check(config.keep_vars === true && config.vars?.ENVIRONMENT === 'staging', 'Staging configuration must preserve existing variables; deployment blocked.');
            check(!config.env && !config.routes && !config.route, 'Staging configuration must not define other environments or routes; deployment blocked.');
            check(config.r2_buckets?.length === 2 && config.r2_buckets.every((binding) => expectedBuckets[binding.binding] === binding.bucket_name), 'Unexpected configured R2 buckets; deployment blocked.');
            check(new Set(config.r2_buckets.map((binding) => binding.binding)).size === 2, 'Duplicate configured R2 binding; deployment blocked.');

            const settings = await api('settings');
            check(Array.isArray(settings.bindings), 'Missing staging bindings; deployment blocked.');
            const buckets = settings.bindings.filter((binding) => binding.type === 'r2_bucket');
            check(buckets.length === 2 && buckets.every((binding) => expectedBuckets[binding.name] === binding.bucket_name), 'Existing staging R2 bindings do not match the approved buckets; deployment blocked.');
            check(new Set(buckets.map((binding) => binding.name)).size === 2, 'Duplicate existing R2 binding; deployment blocked.');
            const rpcBinding = settings.bindings.find((binding) => binding.name === 'WEB3_ENDPOINT_MAP');
            check(rpcBinding && ['secret_text', 'plain_text', 'json'].includes(rpcBinding.type), 'Existing staging RPC binding is missing; deployment blocked.');

            const preservedVariables = settings.bindings
              .filter((binding) => ['plain_text', 'json'].includes(binding.type) && !['ENVIRONMENT', 'SOURCE_COMMIT'].includes(binding.name))
              .map((binding) => ({ name: binding.name, fingerprint: fingerprint(binding) }));
            writeFileSync(join(process.env.RUNNER_TEMP, 'staging-variable-fingerprints.json'), JSON.stringify(preservedVariables), { mode: 0o600 });

            const deployments = await api('deployments');
            const previous = deployments.deployments?.[0];
            check(previous && uuid.test(previous.id) && previous.versions?.length > 0, 'Missing previous staging deployment; deployment blocked.');
            const versions = [];
            for (const version of previous.versions) {
              check(uuid.test(version.version_id) && Number.isFinite(version.percentage), 'Invalid previous staging version metadata; deployment blocked.');
              const details = await api(`versions/${version.version_id}`);
              check(details.id === version.version_id, 'Staging version identity mismatch; deployment blocked.');
              versions.push({
                version_id: version.version_id,
                percentage: version.percentage,
                created_on: details.metadata?.created_on,
                source: details.metadata?.source,
                compatibility_date: details.resources?.script_runtime?.compatibility_date,
              });
            }
            const snapshot = {
              account_id: account,
              script,
              replaced_by_commit: process.env.GITHUB_SHA,
              recorded_at: new Date().toISOString(),
              deployment: { id: previous.id, created_on: previous.created_on, strategy: previous.strategy, versions },
              r2_buckets: expectedBuckets,
              rpc_binding_type: rpcBinding.type,
            };
            writeFileSync(join(process.env.RUNNER_TEMP, 'staging-rollback.json'), JSON.stringify(snapshot, null, 2));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Staging preflight passed for \`${script}\`. Previous deployment: \`${previous.id}\`. Rollback version(s): ${versions.map((version) => `\`${version.version_id}\` (${version.percentage}%)`).join(', ')}. Sanitized rollback metadata is retained as a workflow artifact.\n`);
            console.log('Existing staging worker, account, R2 bindings, RPC secret and rollback versions verified.');
          } catch (error) {
            console.error(error instanceof GuardError ? error.message : 'Staging preflight failed; deployment blocked.');
            process.exitCode = 1;
          }
          NODE

      - name: Retain sanitized staging rollback metadata
        uses: actions/upload-artifact@v4
        with:
          name: staging-rollback-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-rollback.json
          if-no-files-found: error
          retention-days: 30

      - name: Deploy staging only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm wrangler deploy --config wrangler.staging.jsonc --minify --keep-vars
          --var "SOURCE_COMMIT:$GITHUB_SHA"

      - name: Verify deployed staging bindings and commit
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';

          class GuardError extends Error {}
          const check = (condition, message) => {
            if (!condition) throw new GuardError(message);
          };
          try {
            const account = '15dcc9085cb794bb4f29d3e8177ac880';
            check(process.env.CLOUDFLARE_ACCOUNT_ID === account, 'Unexpected Cloudflare account; verification failed.');
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/avatar-upload-staging/settings`, {
              headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
              signal: AbortSignal.timeout(20_000),
              redirect: 'error',
            });
            check(response.ok, 'Cannot read deployed staging settings.');
            const settings = await response.json();
            check(settings.success === true && Array.isArray(settings.result?.bindings), 'Invalid deployed staging settings.');
            const bindings = settings.result.bindings;
            const buckets = bindings.filter((binding) => binding.type === 'r2_bucket');
            const expectedBuckets = { AVATAR_BUCKET: 'staging-avatar-storage', HEADER_BUCKET: 'staging-header-storage' };
            check(buckets.length === 2 && buckets.every((binding) => expectedBuckets[binding.name] === binding.bucket_name) && new Set(buckets.map((binding) => binding.name)).size === 2, 'Deployed staging R2 bindings changed unexpectedly.');
            const snapshot = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'staging-rollback.json'), 'utf8'));
            check(bindings.some((binding) => binding.name === 'WEB3_ENDPOINT_MAP' && binding.type === snapshot.rpc_binding_type), 'Staging RPC binding was not preserved.');
            check(bindings.some((binding) => binding.name === 'SOURCE_COMMIT' && binding.text === process.env.GITHUB_SHA), 'Deployed staging commit binding does not match this run.');
            check(bindings.some((binding) => binding.name === 'ENVIRONMENT' && binding.text === 'staging'), 'Deployed worker is not configured for staging.');
            const preservedVariables = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'staging-variable-fingerprints.json'), 'utf8'));
            check(preservedVariables.every((previous) => bindings.some((binding) => binding.name === previous.name && createHash('sha256').update(JSON.stringify([binding.type, binding.text, binding.json])).digest('hex') === previous.fingerprint)), 'An existing staging variable was not preserved.');

            let healthy = false;
            for (let attempt = 0; attempt < 20; attempt++) {
              try {
                const healthResponse = await fetch(`https://avatar-upload-staging.ens-cf.workers.dev/health?commit=${process.env.GITHUB_SHA}`, {
                  headers: { 'Cache-Control': 'no-cache' },
                  signal: AbortSignal.timeout(10_000),
                  redirect: 'error',
                });
                if (healthResponse.ok) {
                  const health = await healthResponse.json();
                  healthy = health.status === 'ok' && health.environment === 'staging' && health.commit === process.env.GITHUB_SHA;
                }
              } catch {
                // Retry while the newly deployed version propagates.
              }
              if (healthy) break;
              await new Promise((resolve) => setTimeout(resolve, 3000));
            }
            check(healthy, 'Staging health endpoint did not confirm this commit. Use the retained rollback metadata to investigate.');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Verified staging health for commit \`${process.env.GITHUB_SHA}\`: https://avatar-upload-staging.ens-cf.workers.dev/health\n`);
            console.log('Staging health confirms the deployed commit; staging buckets, RPC secret and existing variables are preserved.');
          } catch (error) {
            console.error(error instanceof GuardError ? error.message : 'Staging deployment verification failed.');
            process.exitCode = 1;
          }
          NODE

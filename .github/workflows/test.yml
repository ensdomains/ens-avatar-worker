name: Test

on: [push]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - run: pnpm install --frozen-lockfile
      - run: pnpm test --run
      - run: pnpm type-check
      - run: pnpm lint
      - name: Build staging worker without deploying
        run: >-
          pnpm wrangler deploy --config wrangler.staging.jsonc --dry-run
          --outdir "$RUNNER_TEMP/avatar-upload-staging"
          --var "SOURCE_COMMIT:$GITHUB_SHA"
        env:
          WRANGLER_SEND_METRICS: "false"

  deploy-staging:
    name: Deploy existing staging worker
    needs: test
    if: github.repository == 'ensdomains/ens-avatar-worker' && github.ref == 'refs/heads/yoginth/legacy-avatar-security-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: avatar-upload-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Deploy only to the existing ENS staging worker
        run: |
          test "$CLOUDFLARE_ACCOUNT_ID" = "15dcc9085cb794bb4f29d3e8177ac880"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          pnpm wrangler deploy --config wrangler.staging.jsonc --minify --keep-vars --var "SOURCE_COMMIT:$GITHUB_SHA"
      - name: Verify the deployed staging commit
        run: |
          node --input-type=module <<'NODE'
          for (let attempt = 0; attempt < 20; attempt++) {
            const response = await fetch(`https://avatar-upload-staging.ens-cf.workers.dev/health?commit=${process.env.GITHUB_SHA}`);
            const health = await response.json();
            if (health.status === 'ok' && health.environment === 'staging' && health.commit === process.env.GITHUB_SHA) process.exit(0);
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          throw new Error('Staging health did not confirm this commit');
          NODE
